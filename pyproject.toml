[project]
name = "storedesk"
version = "1.0.0"
requires-python = ">=3.12"
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
[tool.coverage.run]
source = ["accounts", "catalog", "inventory", "trading", "analytics"]
omit = ["*/migrations/*", "*/management/*"]

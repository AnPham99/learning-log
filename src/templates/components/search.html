<form method="get" class="searchbar" role="search">
    <label class="sr-only" for="search">Tìm kiếm</label><input class="input"
       type="search"
       id="search"
       name="q"
       value="{{ query }}"
       placeholder="{{ placeholder|default:'Tìm theo tên, mã hoặc thông tin liên quan…' }}"
       maxlength="200">
    {% if request.GET.low %}<input type="hidden" name="low" value="{{ request.GET.low }}">{% endif %}
    {% if statuses %}<label class="sr-only" for="status">Trạng thái</label><select class="input" name="status" id="status"><option value="">Mọi trạng thái</option>{% for value, label in statuses %}<option value="{{ value }}"
        {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>{% endif %}
    <button class="button secondary">Tìm kiếm</button>{% if query or request.GET.status or request.GET.low %}<a class="text-link" href="{{ request.path }}">Bỏ lọc</a>{% endif %}</form>
